spring.application.name=elo-vet-agendamento
server.port=${PORT:8081}

# ---------------------------------------------------------------
# Oracle: mesma base do projeto de Mastering Relational Database
# (tabelas, pkg_elovet e trigger criados pelos scripts SQL do grupo)
# ---------------------------------------------------------------
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema pertence aos scripts SQL: o Hibernate nao cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---------------------------------------------------------------
# MongoDB: destino da auditoria
# Em desenvolvimento, o compose.yaml sobe o Mongo e o Spring Boot
# configura a conexao sozinho. Fora dele, informe MONGODB_URI.
# ---------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://root:secret@localhost:27017/elovet?authSource=admin}
spring.data.mongodb.auto-index-creation=true
spring.docker.compose.lifecycle-management=start-only

# ---------------------------------------------------------------
# Sincronizacao elo_auditoria (Oracle) -> auditoria_agendamento (MongoDB)
# Padrao: todos os dias as 02:00 (horario de Brasilia)
# ---------------------------------------------------------------
elovet.auditoria.sync-cron=${AUDITORIA_SYNC_CRON:0 */2 * * * *}

# ---------------------------------------------------------------
# CORS: origens do Portal do Veterinario (separadas por virgula)
# ---------------------------------------------------------------
elovet.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# ---------------------------------------------------------------
# Logs
# LOG_LEVEL=DEBUG mostra tambem as consultas e o total de pendencias da auditoria
# ---------------------------------------------------------------
logging.level.br.com.fiap.elovetagendamento=${LOG_LEVEL:INFO}
logging.pattern.console=%d{dd/MM/yyyy HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{0}) - %msg%n
